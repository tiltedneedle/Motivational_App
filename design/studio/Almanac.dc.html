    @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .up { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }

    .draw { animation: draw 1.6s cubic-bezier(.4,.1,.2,1) .7s both; }
