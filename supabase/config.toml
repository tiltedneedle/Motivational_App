# Local development: `supabase start`, then `supabase functions serve`.
project_id = "morrow"

[api]
enabled = true
port = 54321
# graphql_public is what a fresh project exposes; declared here so a config
# push does not take it away.
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "morrow://"
# Where a sign-in link may land. The scheme is the installed app; the two
# localhost ports are the dev server and `pnpm serve` over the built bundle.
# Add the deployed web origin here after the first deploy — the exact origin,
# e.g. "https://morrow.vercel.app/**". Never a bare "https://*.vercel.app/**":
# anyone can host on that domain, and a redirect allow-list that wide hands
# them a session.
additional_redirect_urls = ["morrow://", "http://localhost:8081", "http://localhost:8790", "https://selfauthoring00.vercel.app/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
# The app asks for a six-digit code, not a link: a link opens the mail app and
# then has to find its way back. The hosted project needs the same — set the
# Magic Link template to carry {{ .Token }} (see README, "What needs a key").
otp_length = 6
otp_expiry = 600

# The email that carries the code. The project's free tier with the default
# email provider refuses template changes ("Email template modification is
# not available for free tier projects using the default email provider"),
# so these two tables stay commented until the project is on Pro — which the
# PRD plans before the demo — or has its own SMTP. Until then the email
# carries a link, and the app signs in from the link (deep link, morrow://)
# as well as from a code. Uncomment and `pnpm sb config push` when it can.
#
# [auth.email.template.magic_link]
# subject = "Your Morrow code"
# content_path = "./supabase/templates/magic_link.html"
#
# A brand-new address goes through the sign-up path, which sends this
# template rather than the magic link's; the same six digits, the same file.
# [auth.email.template.confirmation]
# subject = "Your Morrow code"
# content_path = "./supabase/templates/magic_link.html"

[auth.external.google]
# Sign in with Google. The web client id and its secret from Google Cloud
# (README, "Google sign-in"); the redirect URI registered there is this
# project's /auth/v1/callback. Off until both exist. The id also goes in the
# app's environment as EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID, which shows the button.
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# The native module (a later step) signs in with an id token; its iOS client
# id is listed here too when it exists, so the token is accepted.
# additional_client_ids = "..."

[auth.external.apple]
# Sign in with Apple, from the identity token the OS hands the app. The client
# id is the bundle identifier; the secret is not needed for native sign-in.
enabled = true
client_id = "app.morrow.client"
secret = ""

# Every function needs a signed-in user. None of them are public.
[functions.readback]
verify_jwt = true

[functions.safety]
verify_jwt = true

[functions.scene]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
